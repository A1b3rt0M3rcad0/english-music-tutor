[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "english-music-tutor"
version = "0.1.0"
description = "Tutor de inglês personalizado no Codex, orientado por músicas, com memória local e revisões"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
english-tutor = "tutor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["tutor*"]
